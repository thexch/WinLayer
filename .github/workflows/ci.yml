name: Windows CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore WinLayer.slnx
      - name: Build
        run: dotnet build WinLayer.slnx -c Release --no-restore -warnaserror
      - name: Package a CI build
        run: ./scripts/Package-Windows.ps1 -Version "0.1.0-ci.$env:GITHUB_RUN_NUMBER"
      - name: Install and test WinLayer
        run: ./scripts/Test-WindowsPackage.ps1 -Version "0.1.0-ci.$env:GITHUB_RUN_NUMBER"
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-test-results
          path: |
            tests/WinLayer.Tests/TestResults/*.trx
            artifacts/setup-smoke.log
      - name: Archive the installer for manual validation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: WinLayer-Windows-x64
          path: artifacts/releases/*-Setup.exe
          if-no-files-found: error
          retention-days: 14
